<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatAI – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #667eea;
      --primary-dark: #5a6fd8;
      --secondary: #764ba2;
      --accent: #f64f59;
      --ai-bg: #f0f4ff;
      --ai-border: #d6e0ff;
      --user-gradient: linear-gradient(135deg, #667eea, #764ba2);
      --sidebar-bg: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #f5f7fb;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      padding: 0;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 12px rgba(102,126,234,0.4);
      flex-shrink: 0;
    }
    .brand-text h2 { color: #fff; font-size: 17px; font-weight: 700; }
    .brand-text p  { color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 1px; }

    .sidebar-body {
      flex: 1;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.3);
      padding: 0 6px;
      margin: 8px 0 4px;
    }

    .new-chat-btn {
      width: 100%;
      padding: 11px 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(102,126,234,0.35);
      margin-bottom: 12px;
    }
    .new-chat-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-profile:hover { background: rgba(255,255,255,0.1); }
    .avatar {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #f64f59, #c471ed);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-info .uname {
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-info .urole {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
    }
    .logout-icon {
      color: rgba(255,255,255,0.4);
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s;
      padding: 4px;
    }
    .logout-icon:hover { color: #f64f59; }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f5f7fb;
    }

    /* ── Top bar ── */
    .topbar {
      padding: 14px 24px;
      background: #fff;
      border-bottom: 1px solid #e8ecf4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #555;
    }
    .topbar-title { font-size: 16px; font-weight: 700; color: #1a1a2e; }
    .topbar-sub   { font-size: 12px; color: #aaa; margin-top: 1px; }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #22c55e;
      background: #f0fdf4;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid #bbf7d0;
      font-weight: 500;
    }
    .status-dot {
      width: 7px; height: 7px;
      background: #22c55e;
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ── Messages ── */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 40px 20px;
    }
    .empty-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #667eea22, #764ba222);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      margin-bottom: 4px;
    }
    .empty-state h3 { font-size: 20px; font-weight: 700; color: #1a1a2e; }
    .empty-state p  { font-size: 14px; color: #888; max-width: 280px; line-height: 1.6; }

    .suggestion-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 12px;
    }
    .chip {
      padding: 8px 16px;
      background: #fff;
      border: 1.5px solid #e0e7ff;
      border-radius: 20px;
      font-size: 13px;
      color: var(--primary);
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    .chip:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* ── Message bubbles ── */
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user-row { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .msg-avatar.ai-av  { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    .msg-avatar.user-av{ background: linear-gradient(135deg, #f64f59, #c471ed); color: #fff; font-weight: 700; font-size: 12px; }

    .msg-content { max-width: 70%; display: flex; flex-direction: column; gap: 4px; }
    .msg-row.user-row .msg-content { align-items: flex-end; }

    .msg-sender { font-size: 11px; color: #aaa; font-weight: 500; padding: 0 4px; }

    .bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .user-bubble {
      background: var(--user-gradient);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(102,126,234,0.35);
    }
    .ai-bubble {
      background: #fff;
      color: #2d2d2d;
      border-bottom-left-radius: 4px;
      border: 1.5px solid var(--ai-border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .msg-time { font-size: 10px; color: #ccc; padding: 0 4px; }

    /* ── Typing indicator ── */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }
    .typing-bubble {
      background: #fff;
      border: 1.5px solid var(--ai-border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .typing-dot {
      width: 7px; height: 7px;
      background: #aac4ff;
      border-radius: 50%;
      animation: typing 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── Input area ── */
    .input-area {
      padding: 16px 24px 20px;
      background: #fff;
      border-top: 1px solid #e8ecf4;
      flex-shrink: 0;
    }
    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #f5f7fb;
      border: 2px solid #e8ecf4;
      border-radius: 16px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
      background: #fff;
    }
    #msg-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 2px 0;
    }
    #msg-input::placeholder { color: #bbb; }

    #send-btn {
      width: 40px; height: 40px;
      background: var(--user-gradient);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      box-shadow: 0 4px 12px rgba(102,126,234,0.35);
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 6px 18px rgba(102,126,234,0.45); }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .input-hint {
      font-size: 11px;
      color: #bbb;
      text-align: center;
      margin-top: 8px;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 99;
      }
      .overlay.show { display: block; }
      .mobile-menu-btn { display: block; }
      .messages-area { padding: 16px; }
      .input-area { padding: 12px 16px 16px; }
      .msg-content { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">💬</div>
          <div class="brand-text">
            <h2>ChatAI</h2>
            <p>Powered by Gemini</p>
          </div>
        </div>
      </div>

      <div class="sidebar-body">
        <button class="new-chat-btn" onclick="clearChat()">
          <span>✏️</span> New Chat
        </button>
        <div class="sidebar-section-label">Recent Chats</div>
        <div id="recent-label" style="font-size:12px; color:rgba(255,255,255,0.3); padding: 4px 6px;">
          Your chats appear here
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar" id="sidebar-avatar">?</div>
          <div class="user-info">
            <div class="uname" id="sidebar-name">Loading...</div>
            <div class="urole">Free Plan</div>
          </div>
          <span class="logout-icon" onclick="logout()" title="Logout">↩</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <!-- Top bar -->
      <div class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <div>
            <div class="topbar-title">AI Assistant</div>
            <div class="topbar-sub" id="topbar-sub">Ask me anything</div>
          </div>
        </div>
        <div class="status-badge">
          <div class="status-dot"></div>
          Online
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-area" id="messages">
        <!-- Empty state shown initially -->
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🤖</div>
          <h3>What's on your mind?</h3>
          <p>I'm your AI assistant powered by Gemini. Ask me anything you're curious about.</p>
          <div class="suggestion-chips">
            <button class="chip" onclick="useSuggestion(this)">✨ Write a poem</button>
            <button class="chip" onclick="useSuggestion(this)">🌍 Explain climate change</button>
            <button class="chip" onclick="useSuggestion(this)">💡 Brainstorm ideas</button>
            <button class="chip" onclick="useSuggestion(this)">🐍 Python tips</button>
          </div>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-box">
          <textarea id="msg-input" rows="1" placeholder="Message ChatAI..."></textarea>
          <button id="send-btn" onclick="sendMessage()" title="Send">➤</button>
        </div>
        <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
