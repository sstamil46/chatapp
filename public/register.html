<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – ChatAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 50%, #667eea 100%);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 450px; height: 450px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      top: -100px; right: -100px;
      animation: pulse 7s ease-in-out infinite;
    }
    body::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: rgba(255,255,255,0.06);
      border-radius: 50%;
      bottom: -80px; left: -80px;
      animation: pulse 5s ease-in-out infinite reverse;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(20px);
      padding: 40px 36px;
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(17,153,142,0.4);
    }
    .logo h1 { font-size: 22px; font-weight: 700; color: #1a1a2e; }
    .logo p  { font-size: 13px; color: #888; margin-top: 2px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: #aaa;
      pointer-events: none;
    }
    input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: #333;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #11998e;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(17,153,142,0.12);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 6px 20px rgba(17,153,142,0.4);
    }
    .btn:hover  { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(17,153,142,0.5); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .msg { font-size: 13px; margin-top: 12px; text-align: center; }
    .error { color: #e74c3c; font-weight: 500; }
    .footer-link { color: #666; margin-top: 18px; }
    .footer-link a {
      color: #11998e;
      font-weight: 600;
      text-decoration: none;
    }
    .footer-link a:hover { text-decoration: underline; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 18px 0;
      color: #ccc; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #eee;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🚀</div>
      <h1>Create an account</h1>
      <p>Join ChatAI and start chatting</p>
    </div>

    <label for="name">Full name</label>
    <div class="input-wrap">
      <span class="icon">👤</span>
      <input type="text" id="name" placeholder="Your full name" autocomplete="name" />
    </div>

    <label for="email">Email address</label>
    <div class="input-wrap">
      <span class="icon">✉️</span>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <label for="password">Password</label>
    <div class="input-wrap">
      <span class="icon">🔒</span>
      <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" />
    </div>

    <label for="confirm">Confirm password</label>
    <div class="input-wrap">
      <span class="icon">🔐</span>
      <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password" />
    </div>

    <button class="btn" id="reg-btn" onclick="register()">Create Account</button>
    <p class="msg error" id="error-msg"></p>

    <div class="divider">or</div>
    <p class="msg footer-link">Already have an account? <a href="/">Sign in</a></p>
  </div>

  <script src="register.js"></script>
</body>
</html>
